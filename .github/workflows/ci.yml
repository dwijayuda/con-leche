# ConLeche CI (2026-09-06, external review §5.1: "add a CI workflow …
# until then the headline is unverifiable").
#
# ---------------------------------------------------------------------
# WHAT THIS JOB COVERS
#
#   lake build       every library and executable, and it must be
#                    WARNING-FREE (a `warning:` line fails the job —
#                    the project rule, enforced nowhere else).
#   lake test        the `ConLecheTests` library: the `#guard`/`example`
#                    suite AND `tests/ConLecheTests/Axioms.lean`, whose
#                    `#print axioms` guards pin the consistency
#                    capstones at exactly
#                    [propext, Classical.choice, Quot.sound].
#   tests/arena.sh   the standard battery, which is itself nine gates
#                    plus four suites:
#                      * tests/layering.sh       import fence
#                      * tests/pindump.sh        committed-generator
#                                                freshness
#                      * tests/trust-surface.sh  compiler-escape
#                                                allowlist
#                      * tests/overview-links.sh OVERVIEW.md's and
#                                                README.md's line
#                                                anchors vs. the tree
#                                                (tasks #216, #299) — it
#                                                needs no build and no
#                                                separate step here:
#                                                arena.sh is its caller
#                      * tests/quote-gate.sh     the ```lean blocks of
#                                                README.md and
#                                                OVERVIEW.md that quote
#                                                a theorem's statement,
#                                                compared textually with
#                                                the source's own header
#                                                (task #302) — same
#                                                caller, no build
#                      * tests/no-local-paths.sh no absolute home paths
#                                                in tracked files
#                      * tests/shake.sh          `lake shake`'s import
#                                                proposals against
#                                                tests/shake-allowlist.txt,
#                                                and `public import`
#                                                demotability (task #235)
#                      * tests/challenge.sh      the Comparator pair
#                                                (task #281): the
#                                                challenge module builds
#                                                with its sorry warnings
#                                                and nothing else, and
#                                                every comparator.json
#                                                name has a
#                                                token-identical
#                                                statement in challenge
#                                                and solution — nothing
#                                                else in the battery
#                                                builds that module
#                      * the axiom pin (as the `axioms:` line)
#                      * the vendored arena tutorial snapshot
#                        (tests/arena/lean-arena-tests.tar.gz — pinned
#                        and committed, so CI never depends on the live
#                        arena's progression)
#                      * the e2e, annot and mode suites
#                      * the `--trusted` sweep of all three suites
#
# WHAT IT DELIBERATELY DOES **NOT** COVER — and why the local battery is
# still the real one:
#
#   * init-full (the full `Init` export, 60 549 declarations) and the
#     Mathlib-scale frontier runs.  Tens of GiB of RSS and tens of
#     minutes each, coordinated ONE AT A TIME on the development
#     machine.  They are the *frontier measurement*, not a regression
#     gate; putting them here would make CI both slow and flaky without
#     making it more informative.  See DESIGN.md's frontier sections.
#   * the performance battery (PERF.md).  Timings on a shared CI runner
#     are noise.
#   * TOOLCHAIN DRIFT.  Everything here exports with the repo's own
#     `lean-toolchain`, so a stream produced by a *different* Lean —
#     which is what a bundled con-leche is handed — is never exercised.
#     That is `.github/workflows/natop-matrix.yml`'s job: it exports the
#     pinned `Nat` operations and the compiler-trust opaque values with
#     every Lean release since v4.29.0, the newest release candidate and
#     the newest nightly, and checks the results with one binary built
#     from `lean-toolchain`.  Weekly, on dispatch, and on pushes that
#     touch the pins or `scripts/natop-matrix.sh`.
#
# ---------------------------------------------------------------------
# NOTES ON THE ENVIRONMENT
#
#   * Toolchain: installed by `elan` from the repo's `lean-toolchain`
#     (leanprover/lean4:v4.35.0-rc3 at the time of writing).  Never pin the
#     version here — `lean-toolchain` is the single source, and
#     `tests/pindump.sh` independently runs the checker over the
#     running toolchain's `Init` export and fails unless a committed
#     pin set matches it (task #328: a bump adds no dump when one
#     does).  It reproduces the committed dumps too, one per
#     `pinners/*/`, but only for toolchains elan already has — which
#     here is none of them, so those are labelled SKIPs.  `natop-matrix.yml`'s `regenerate` job runs the same gate
#     with `PINDUMP_INSTALL=1` and reproduces every one.
#   * Network: needed once, for elan.  The package has NO dependencies
#     since task #207 (`lake-manifest.json`'s `packages` array is
#     empty) and the arena fixtures are vendored, so nothing else is
#     fetched.
#   * TIME.  A cold full build is ~650 modules of proof-heavy Lean; on a
#     two-core runner that is long.  The `.lake` cache below makes the
#     common case incremental; `timeout-minutes` is set generously and
#     deliberately, not tuned.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # `--default-toolchain none` on purpose: elan then reads
      # `lean-toolchain` and installs exactly that on the first `lake`
      # call, so the toolchain is named in ONE place in the repo.
      - name: Install elan (toolchain comes from lean-toolchain)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: |
          lean --version
          lake --version

      # Build artifacts are cached across runs so the usual push is
      # incremental.  The key moves with the source tree; the restore
      # keys let a run start from the previous build of this branch,
      # then of the default branch.
      - name: Restore .lake
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
            lake-${{ runner.os }}-

      # Source fences are cheap and run before the proof-heavy build. C1's
      # actual acceptance/model capstones and axiom pins are then built FIRST.
      # Later targets reuse these outputs; there is no second cold proof build.
      - name: C1 source and trust boundaries
        run: |
          set -euo pipefail
          python3 tests/c1/source_gate.py
          bash tests/trust-surface.sh

      - name: C1 model and consistency proofs first (warning-free)
        run: |
          set -euo pipefail
          timeout 10800 lake build PskernelC1Proof PskernelC1Tests 2>&1 | tee c1-proof.log
          if grep -n 'warning:' c1-proof.log; then
            echo '::error::C1 proof or axiom audit produced warnings.'
            exit 1
          fi

      # THE WARNING-FREE RULE (CLAUDE.md: "`lake build` must stay
      # warning-free").  Lake exits 0 on warnings, so the grep is the
      # gate; `pipefail` keeps a build *error* fatal as well.
      - name: lake build (must be warning-free)
        run: |
          set -euo pipefail
          lake build 2>&1 | tee build.log
          if grep -n 'warning:' build.log; then
            echo '::error::lake build produced warnings (see the lines above);'
            echo '::error::the tree must stay warning-free.'
            exit 1
          fi

      # THE WHITEPAPER FRAGMENT (task #324): the paper's own Lean
      # verification is a library off the default targets, so the build
      # above never touches it; its gate builds it warning-free and its
      # axiom pin is a `#guard_msgs` in the library's root.  Here, not in
      # whitepaper.yml, because this job has the toolchain.
      - name: whitepaper/fragment-gate.sh
        run: whitepaper/fragment-gate.sh

      # `lake test` builds the ConLecheTests library.  The suite is
      # `#guard`/`example`-based and the axiom pin is
      # `#guard_msgs in #print axioms`, so *elaboration* is the test:
      # a failure is a build error with the offending message inline.
      # The warning check is repeated here on purpose: `ConLecheTests` is
      # NOT a default target, so the `lake build` step above never
      # reaches it — the same reason `tests/pindump.sh` re-checks
      # warnings for `natop-pins-export`.
      - name: lake test (suite + the capstone axiom pin)
        run: |
          set -euo pipefail
          lake test 2>&1 | tee test.log
          if grep -n 'warning:' test.log; then
            echo '::error::lake test produced warnings (see the lines above).'
            exit 1
          fi

      - name: C1 shipped CLI and optional statistics
        run: |
          set -euo pipefail
          bash tests/c1/verdicts.sh 2>&1 | tee c1-verdicts.log
          bash tests/pskernel-c1-stats.sh 2>&1 | tee c1-stats.log

      - name: C1 matched resource smoke (verdicts gate, timings advisory)
        run: |
          set -euo pipefail
          python3 tests/c1/perf_smoke.py --repetitions 3 --jobs 1 2>&1 | tee c1-perf.log
          cat _tmp/c1/perf/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package the C1 Linux executable
        run: |
          set -euo pipefail
          mkdir -p _tmp/c1
          tar -czf _tmp/c1/pskernel-c1-linux-x86_64.tar.gz -C .lake/build/bin pskernel-c1

      # The standard battery.  It rebuilds nothing of consequence (the
      # step above already did) and runs every gate and suite listed at
      # the top of this file, including the `--trusted` sweep.
      - name: tests/arena.sh (gates + arena/e2e/annot suites + trusted sweep)
        run: |
          set -euo pipefail
          bash tests/arena.sh 2>&1 | tee arena.log
          # arena.sh's exit code is the verdict; `pipefail` propagates it.

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build.log
            test.log
            arena.log
            c1-proof.log
            c1-verdicts.log
            c1-stats.log
            c1-perf.log
          if-no-files-found: ignore

      - name: Upload C1 executable, provenance and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pskernel-c1-linux-${{ github.sha }}
          path: |
            _tmp/c1/pskernel-c1-linux-x86_64.tar.gz
            _tmp/c1/source-closure.json
            _tmp/c1/verdicts
            _tmp/c1/perf/report.json
            _tmp/c1/perf/summary.md
            _tmp/c1/perf/logs
            lean-toolchain
            PSKERNEL_C1.md
          if-no-files-found: ignore

      # Save completed modules even when a later proof, CLI build or gate
      # fails. A fix restores the partial cache and Lake checks its traces;
      # the many unchanged foundational proofs need not rebuild from scratch.
      - name: Save .lake, including partial successful builds
        if: always() && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
